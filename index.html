                                    "Robôs equipados com recursos de inteligência artificial podem reconhecer objetos, analisar informações do ambiente e adaptar determinadas ações às condições identificadas. Essa capacidade surge da combinação entre componentes físicos e tecnologias de \\[a href=\"\\[URL Pillar Page\\]\"\\]Inteligência Artificial\\[/a\\], que permitem processar dados e apoiar decisões. Mas nem toda máquina automatizada utiliza IA. Entender essa diferença é o primeiro passo para conhecer como essas tecnologias trabalham juntas e onde podem ser aplicadas.",
                                    "## **Como a Inteligência Artificial é aplicada em robôs?**",
                                    "A robótica é uma área da tecnologia dedicada ao desenvolvimento de máquinas capazes de executar ações físicas. Para isso, utiliza componentes como sensores, motores e sistemas de controle.",
                                    "Já a inteligência artificial reúne técnicas computacionais que permitem analisar informações, identificar padrões e realizar tarefas como classificações e previsões.",
                                    "Quando essas duas áreas se combinam, os equipamentos podem apresentar comportamentos mais flexíveis diante de determinadas mudanças no ambiente.",

                                    "Isso não significa que a máquina pense como uma pessoa ou tenha consciência. Suas capacidades dependem dos algoritmos utilizados, das informações disponíveis e dos limites estabelecidos durante o desenvolvimento.",
                                    "## **Como funciona a integração entre robótica e Inteligência Artificial?**",
                                    "A integração entre essas tecnologias depende de componentes físicos e sistemas computacionais que trabalham de maneira coordenada.",
                                    "Na prática, o funcionamento pode ser dividido em três etapas principais.",
                                    "### **1\\. Percepção do ambiente**",
                                    "A primeira etapa consiste em captar informações sobre o ambiente e as condições de funcionamento do equipamento.",
                                    "Para isso, são utilizados sensores, dispositivos capazes de medir características como distância, posição e temperatura.",
                                    "Câmeras também podem fornecer imagens para sistemas de visão computacional, tecnologia que permite identificar e interpretar elementos visuais.",
                                    "Assim, um equipamento pode reconhecer objetos em seu caminho ou identificar peças em uma linha de produção.",
                                    "### **2\\. Processamento de informações e tomada de decisão**",
                                    "Depois de receber os dados, o sistema precisa interpretá-los e determinar quais ações são adequadas.",
                                    "Essa etapa pode envolver regras programadas, algoritmos de planejamento e técnicas de Machine Learning, ou aprendizado de máquina, que permitem desenvolver modelos capazes de reconhecer padrões a partir de dados.",
                                    "Um robô móvel, por exemplo, pode avaliar possíveis trajetórias para chegar a um destino e selecionar um caminho que respeite os limites de segurança definidos.",
                                    "### **3\\. Execução de movimentos e monitoramento**",
                                    "Após selecionar uma ação, o robô utiliza atuadores, componentes que transformam comandos de controle em movimentos físicos.",
                                    "Durante a execução, sensores podem continuar fornecendo informações para que o equipamento ajuste sua velocidade, direção ou posicionamento.",
                                    "Esse processo, conhecido como realimentação, permite corrigir determinadas ações com base nas condições observadas.",
                                    "## **Onde os robôs com Inteligência Artificial são utilizados?**",
                                    "A combinação entre robótica e IA pode ser aplicada em diferentes setores. Confira alguns exemplos práticos.",
                                    "### **Indústria e automação**",
                                    "Em ambientes industriais, robôs inteligentes podem auxiliar na identificação de peças, inspeção de produtos e movimentação de materiais.",
                                    "Sistemas de visão computacional, por exemplo, podem analisar imagens para reconhecer características ou possíveis defeitos em componentes.",
                                    "### **Logística e centros de distribuição**",
                                    "Robôs móveis podem transportar mercadorias entre diferentes áreas de um centro de distribuição.",
                                    "Com recursos de percepção e navegação, esses equipamentos conseguem identificar determinados obstáculos e adaptar rotas conforme as condições do ambiente.",
                                    "### **Saúde e assistência médica**",
                                    "Na saúde, tecnologias de robótica e IA podem apoiar atividades como análise de imagens e assistência em procedimentos específicos.",
                                    "Essas aplicações exigem validação rigorosa, mecanismos de segurança e supervisão profissional, especialmente quando envolvem a interação direta com pacientes.",
                                    "### **Agricultura**",
                                    "Na agricultura, equipamentos robotizados podem utilizar câmeras e sistemas de análise de imagens para identificar características de plantas e apoiar operações de monitoramento.",
                                    "Dependendo do projeto, essas informações podem orientar ações específicas, como a inspeção de culturas.",
                                    "## **Quais são os desafios da integração entre robótica e IA?**",
                                    "Desenvolver um robô com inteligência artificial exige mais do que combinar sensores e algoritmos.",
                                    "Um dos desafios é garantir que o sistema consiga interpretar corretamente situações inesperadas. Mudanças de iluminação, obstáculos e falhas na coleta de dados podem comprometer seu desempenho.",
                                    "A segurança também merece atenção. Máquinas que compartilham espaços com pessoas precisam incorporar mecanismos de proteção e passar por testes adequados às condições de uso.",
                                    "Outro ponto importante é a integração entre software, processamento de dados, eletrônica e sistemas físicos.",
                                    "Essa combinação se relaciona às **Engenharias Tech**, que abrangem a construção de soluções tecnológicas complexas. Áreas como Engenharia de Inteligência Artificial, Engenharia de Software e Engenharia de Dados com IA contribuem para diferentes etapas do desenvolvimento desses sistemas.",

                                    "A iniciativa buscava investigar se aspectos da aprendizagem e da inteligência poderiam ser descritos de maneira suficientemente precisa para serem simulados por computadores.",

                                    "Por isso, a conferência é frequentemente considerada o nascimento da inteligência artificial como área científica organizada.",

                                    "* **John McCarthy:** associado à criação do termo *Artificial Intelligence*, foi um dos organizadores da conferência de Dartmouth e desenvolveu a linguagem de programação Lisp.  \n* **Marvin Minsky:** contribuiu para pesquisas sobre aprendizagem, representação do conhecimento e processos associados à cognição.  \n* **Claude Shannon:** conhecido por suas contribuições à teoria da informação, participou da proposta que deu origem ao encontro de Dartmouth.  \n* **Nathaniel Rochester:** envolvido no desenvolvimento de computadores na IBM, também participou da organização da iniciativa.",

                                    "Esses objetivos tinham caráter científico e experimental. Os pesquisadores buscavam compreender os limites da computação e investigar quais capacidades poderiam ser reproduzidas por máquinas.",
                                    "## **Como a Inteligência Artificial evoluiu desde sua criação?**",
                                    "Depois de sua consolidação, a IA passou por diferentes fases de desenvolvimento.",

                                    "Identificar grupos de clientes com hábitos parecidos ou organizar documentos por semelhança são tarefas que podem ser realizadas com **Machine Learning Clustering**. Essa técnica permite descobrir padrões em conjuntos de dados sem precisar definir previamente todas as categorias. Utilizada no aprendizado de máquina, uma das áreas da \\[a href=\"\\[URL Pillar Page\\]\"\\]inteligência artificial\\[/a\\], ela ajuda a encontrar relações entre informações e pode apoiar diferentes tipos de análise. Entenda como funciona esse agrupamento e quando ele pode ser utilizado.",
                                    "## **O que é clustering?**",

                                    "Dependendo do método, essa análise pode considerar distâncias matemáticas, densidade dos dados ou outras medidas de similaridade.",
                                    "O objetivo é formar grupos que apresentem características relevantes em comum.",

        const state = {
            currentChapterIndex: -1,
            theme: 'light',
            fontSize: 'normal',
            bookmarks: [],
            searchQuery: '',
            activePanel: null
        };

        function loadBookmarks() {
            try {
                const saved = localStorage.getItem('ebook_ia_ml_bookmarks');
                state.bookmarks = saved ? JSON.parse(saved) : [];
            } catch (e) {
                state.bookmarks = [];
            }
            updateBookmarksCount();
        }

        function saveBookmarks() {
            localStorage.setItem('ebook_ia_ml_bookmarks', JSON.stringify(state.bookmarks));
            updateBookmarksCount();
        }

        function updateBookmarksCount() {
            const el = document.getElementById('bookmarks-count');
            if (el) el.innerText = state.bookmarks.length;
        }

        function toggleTabPanel(panelName) {
            const searchPanel = document.getElementById('search-panel');
            const bookmarksPanel = document.getElementById('bookmarks-panel');

            if (state.activePanel === panelName) {
                state.activePanel = null;
            } else {
                state.activePanel = panelName;
            }

            if (state.activePanel === 'search') {
                searchPanel.classList.remove('hidden');
                bookmarksPanel.classList.add('hidden');
                const searchInput = document.getElementById('search-input');
                if (searchInput) searchInput.focus();
                renderSearchPanel();
            } else if (state.activePanel === 'bookmarks') {
                bookmarksPanel.classList.remove('hidden');
                searchPanel.classList.add('hidden');
                renderBookmarksPanel();
            } else {
                searchPanel.classList.add('hidden');
                bookmarksPanel.classList.add('hidden');
            }

            updateTabButtonStyles();
        }

        function closePanels() {
            state.activePanel = null;
            document.getElementById('search-panel').classList.add('hidden');
            document.getElementById('bookmarks-panel').classList.add('hidden');
            updateTabButtonStyles();
        }

        function updateTabButtonStyles() {
            const btnSearch = document.getElementById('tab-btn-search');
            const btnBookmarks = document.getElementById('tab-btn-bookmarks');

            btnSearch.className = "px-3 py-1.5 rounded-lg border border-current text-xs font-bold hover:bg-black/5 dark:hover:bg-white/5 transition-all flex items-center space-x-1";
            btnBookmarks.className = "px-3 py-1.5 rounded-lg border border-current text-xs font-bold hover:bg-black/5 dark:hover:bg-white/5 transition-all flex items-center space-x-1";

            if (state.activePanel === 'search') {
                btnSearch.className = "px-3 py-1.5 rounded-lg bg-[#23599c] text-white text-xs font-bold transition-all flex items-center space-x-1 border border-transparent";
            } else if (state.activePanel === 'bookmarks') {
                btnBookmarks.className = "px-3 py-1.5 rounded-lg bg-[#23599c] text-white text-xs font-bold transition-all flex items-center space-x-1 border border-transparent";
            }
        }

        function setChapter(index) {
            state.currentChapterIndex = index;

            const fitaBtn = document.getElementById('bookmark-header-btn');
            if (fitaBtn) {
                if (index === -1) {
                    fitaBtn.classList.add('hidden');
                } else {
                    fitaBtn.classList.remove('hidden');
                    updateHeaderBookmarkIcon();
                }
            }

            const breadcrumb = document.getElementById('header-breadcrumb');
            if (breadcrumb) {
                breadcrumb.innerText = index === -1 ? "CAPA DO E-BOOK" : `ARTIGO ${index + 1} DE ${ebookData.length}`;
            }

            renderContent();
            if (state.activePanel === 'bookmarks') {
                renderBookmarksPanel();
            }

            const container = document.getElementById('scroll-container');
            if (container) {
                container.scrollTop = 0;
            }
        }

        function toggleCurrentBookmark() {
            if (state.currentChapterIndex === -1) return;
            const activeId = ebookData[state.currentChapterIndex].id;
            const idx = state.bookmarks.indexOf(activeId);
            if (idx !== -1) {
                state.bookmarks.splice(idx, 1);
            } else {
                state.bookmarks.push(activeId);
            }
            saveBookmarks();
            updateHeaderBookmarkIcon();
            if (state.activePanel === 'bookmarks') {
                renderBookmarksPanel();
            }
        }

        function updateHeaderBookmarkIcon() {
            const btn = document.getElementById('bookmark-header-btn');
            const icon = document.getElementById('bookmark-header-icon');
            if (!icon || !btn || state.currentChapterIndex === -1) return;
            
            const activeId = ebookData[state.currentChapterIndex].id;
            const isBookmarked = state.bookmarks.includes(activeId);
            
            if (isBookmarked) {
                icon.setAttribute('fill', '#23599c');
                icon.setAttribute('stroke', '#23599c');
                icon.className.baseVal = "w-4 h-4 text-[#23599c] opacity-100 transition-all";
                btn.className = "p-2 rounded-lg bg-sky-100 dark:bg-sky-950/60 text-[#23599c] transition-all";
            } else {
                icon.setAttribute('fill', 'none');
                icon.setAttribute('stroke', 'currentColor');
                icon.className.baseVal = "w-4 h-4 text-current opacity-60 transition-all";
                btn.className = "p-2 rounded-lg hover:bg-black/10 dark:hover:bg-white/10 transition-all";
            }
        }

        function highlightText(text, search) {
            if (!text || !search || !search.trim()) return text;
            const escapedSearch = search.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const regex = new RegExp(`(${escapedSearch})`, 'gi');
            return text.replace(regex, `<mark class="bg-yellow-200 text-black px-0.5 rounded font-semibold">$1</mark>`);
        }

        function renderFormattedText(text, search, isTitle = false) {
            if (!text) return '';
            
            // Tratamento prévio de links pseudo-markdown [a href="..."]texto[/a]
            let sanitized = text.replace(/\\?\[a href="[^"]+"\\?\](.*?)\\?\[\/a\\?\]/g, '$1');
            
            sanitized = sanitized.replace(/\\([.#*+!()\[\]\\])/g, '$1');
            const boldParts = sanitized.split('**');
            let resultHTML = '';
            
            boldParts.forEach((part, index) => {
                const isBold = index % 2 === 1;
                const content = highlightText(part, search);
                if (isBold) {
                    const boldClass = isTitle ? "font-black text-[#689ccb]" : "font-extrabold text-inherit";
                    resultHTML += `<strong class="${boldClass}">${content}</strong>`;
                } else {
                    resultHTML += `<span>${content}</span>`;
                }
            });
            return resultHTML;
        }

        function renderParagraphHTML(paragraph) {
            if (paragraph.split('\n').every(line => /^\s*[*+-]\s+/.test(line))) {
                return '<ul class="ml-5 list-disc space-y-2">' + paragraph.split('\n').map(line =>
                    '<li class="pl-2 leading-relaxed">' + renderFormattedText(line.replace(/^\s*[*+-]\s+/, '').trim(), state.searchQuery, false) + '</li>'
                ).join('') + '</ul>';
            }

            if (paragraph.startsWith('## ')) {
                return `<h3 class="text-xl md:text-2xl font-black mt-8 mb-4 p-3 rounded-xl bg-sky-50 dark:bg-sky-950/40 text-sky-800 dark:text-sky-300 border-l-4 border-sky-500 shadow-sm flex items-center tracking-tight">
                    ${renderFormattedText(paragraph.replace('## ', ''), state.searchQuery, true)}
                </h3>`;
            }
            if (paragraph.startsWith('### ')) {
                return `<h4 class="text-lg md:text-xl font-bold mt-6 mb-3 text-[#23599c] dark:text-[#689ccb]">
                    ${renderFormattedText(paragraph.replace('### ', ''), state.searchQuery, true)}
                </h4>`;
            }
            if (paragraph.startsWith('- ') || paragraph.startsWith('• ')) {
                return `<li class="ml-5 list-disc mb-2 pl-2 leading-relaxed">
                    ${renderFormattedText(paragraph.replace(/^[-•]\s*/, ''), state.searchQuery, false)}
                </li>`;
            }
            if (/^\d+\.\s/.test(paragraph)) {
                return `<p class="ml-2 mb-3 leading-relaxed font-semibold text-slate-800 dark:text-slate-200">
                    ${renderFormattedText(paragraph, state.searchQuery, false)}
                </p>`;
            }

            return `<p class="mb-4 text-justify leading-relaxed">${renderFormattedText(paragraph, state.searchQuery, false)}</p>`;
        }

                        <p class="text-base sm:text-lg md:text-xl text-white font-semibold leading-relaxed max-w-2xl">
                            Construindo o Futuro da Tecnologia: O guia definitivo para entender, projetar e liderar a Inteligência Artificial e Machine Learning.
                        </p>

                        <div class="pt-6">
                            <button onclick="setChapter(0)" class="px-8 py-4 bg-[#23599c] hover:bg-[#1a4478] active:scale-95 text-white font-black text-sm rounded-2xl shadow-lg hover:shadow-[#23599c]/25 transition-all flex items-center space-x-3 mx-auto">
                                <span>ABRIR E-BOOK INTERATIVO</span>
                                <svg class="w-5 h-5 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="w-full mt-12 pt-8 border-t border-white/15">
                        <h3 class="text-sm font-black uppercase tracking-widest text-center text-[#689ccb] drop-shadow-sm mb-6">
                            Índice Geral de Conteúdo
                        </h3>
                        
                        <div class="w-full max-w-3xl mx-auto space-y-2.5 text-left">
                `;

                ebookData.forEach((chap, idx) => {
                    coverHTML += `
                        <button onclick="setChapter(${idx})" class="w-full p-4 border border-white/20 rounded-xl bg-white/5 hover:bg-white/15 text-left transition-all text-white font-semibold whitespace-normal break-words leading-relaxed text-sm block shadow-sm hover:border-[#689ccb]/50">
                            ${chap.title}
                        </button>
                    `;
                });

                coverHTML += `
                        </div>
                    </div>
                </div>
                `;

                container.innerHTML = coverHTML;
                return;
            }

            const article = ebookData[state.currentChapterIndex];
            const fontClasses = {
                small: 'text-xs md:text-sm leading-relaxed',
                normal: 'text-sm md:text-base leading-relaxed',
                large: 'text-lg md:text-xl leading-relaxed',
                xl: 'text-xl md:text-2xl leading-relaxed'
            };

            let paragraphsHTML = '';
            article.content.forEach((paragraph) => {
                paragraphsHTML += renderParagraphHTML(paragraph);
            });

            const articleHTML = `
            <article class="space-y-6 ${fontClasses[state.fontSize]}">
                <header class="space-y-2 pb-6 border-b border-current opacity-80">
                   <div class="text-xs font-bold text-[#23599c] dark:text-[#689ccb] tracking-wider uppercase flex items-center space-x-2">
                     <span>${article.pageRange}</span>
                   </div>
                   <h2 class="text-2xl sm:text-3xl font-black leading-tight">
                        ${renderFormattedText(article.title, state.searchQuery, true)}
                   </h2>
                </header>

                <div class="space-y-4">
                    ${paragraphsHTML}
                </div>

                <div class="p-4 flex flex-col sm:flex-row items-center justify-between gap-4 border-t border-current opacity-60 text-xs font-bold mt-10">
                    <button onclick="setChapter(${state.currentChapterIndex - 1})" class="w-full sm:w-auto px-4 py-2 border rounded-lg hover:bg-black/5 dark:hover:bg-white/5 text-center transition-all flex items-center justify-center space-x-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                        </svg>
                        <span>Anterior</span>
                    </button>

                    <button onclick="setChapter(-1)" class="w-full sm:w-auto px-4 py-2 border rounded-lg hover:bg-black/5 dark:hover:bg-white/5 text-center transition-all">
                        Ir para a Capa
                    </button>

                    ${state.currentChapterIndex < ebookData.length - 1 ? `
                        <button onclick="setChapter(${state.currentChapterIndex + 1})" class="w-full sm:w-auto px-4 py-2 border rounded-lg hover:bg-black/5 dark:hover:bg-white/5 text-center transition-all flex items-center justify-center space-x-2">
                            <span>Próximo</span>
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                            </svg>
                        </button>
                    ` : `
                        <button onclick="setChapter(-1)" class="w-full sm:w-auto px-4 py-2 bg-[#23599c] text-white rounded-lg text-center transition-all">
                            Voltar ao Início
                        </button>
                    `}
                </div>
            </article>
            `;

            container.innerHTML = articleHTML;
        }

        function renderBookmarksPanel() {
            const container = document.getElementById('bookmarks-panel-content');
            if (!container) return;

            let tabHTML = '';
            if (state.bookmarks.length === 0) {
                tabHTML += `
                <p class="text-xs text-center opacity-60 py-8">
                    Nenhum artigo favoritado ainda. Clique no ícone de fita enquanto lê para salvar aqui!
                </p>
                `;
            } else {
                state.bookmarks.forEach(bId => {
                    const chapterIndex = ebookData.findIndex(c => c.id === bId);
                    const chapter = ebookData[chapterIndex];
                    if (chapter) {
                        tabHTML += `
                        <button onclick="setChapter(${chapterIndex}); toggleTabPanel('bookmarks');" class="w-full text-left p-3 rounded-lg border border-current opacity-85 hover:opacity-100 hover:bg-black/5 dark:hover:bg-white/5 text-xs flex justify-between items-center transition-all">
                            <div class="truncate pr-2">
                                <div class="font-semibold">${chapter.title}</div>
                                <div class="text-[10px] opacity-60">${chapter.pageRange}</div>
                            </div>
                            <svg class="w-4 h-4 text-[#23599c] dark:text-[#689ccb] flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
                                <path d="M5 4a2 2 0 012-2h6a2 2 0 012 2v14l-5-2.5L5 18V4z" />
                            </svg>
                        </button>
                        `;
                    }
                });
            }

            container.innerHTML = tabHTML;
        }

        function renderSearchPanel() {
            const resultsContent = document.getElementById('search-results-content');
            const resultsInfo = document.getElementById('search-results-info');
            if (!resultsContent || !resultsInfo) return;

            const results = [];
            if (state.searchQuery.trim()) {
                ebookData.forEach(chapter => {
                    chapter.content.forEach((paragraph, pIdx) => {
                        if (paragraph.toLowerCase().includes(state.searchQuery.toLowerCase())) {
                            results.push({
                                chapterId: chapter.id,
                                chapterTitle: chapter.title,
                                paragraph: paragraph,
                                index: pIdx
                            });
                        }
                    });
                });
            }

            if (state.searchQuery) {
                resultsInfo.classList.remove('hidden');
                resultsInfo.innerText = `${results.length} trechos encontrados`;
            } else {
                resultsInfo.classList.add('hidden');
            }

            let resultsHTML = '';
            results.forEach(res => {
                const matchedChapterIdx = ebookData.findIndex(c => c.id === res.chapterId);
                resultsHTML += `
                <button onclick="setChapter(${matchedChapterIdx}); toggleTabPanel('search');" class="w-full text-left p-2.5 rounded-lg border border-[#23599c]/20 hover:bg-[#23599c]/5 text-xs space-y-1 block transition-all">
                    <div class="font-bold text-[#23599c] dark:text-[#689ccb] truncate">${res.chapterTitle}</div>
                    <p class="line-clamp-3 opacity-80 italic">"...${highlightText(res.paragraph, state.searchQuery)}..."</p>
                </button>
                `;
            });

            if (state.searchQuery && results.length === 0) {
                resultsHTML += `<p class="text-xs text-center opacity-60 py-4">Nenhum resultado para "${state.searchQuery}".</p>`;
            } else if (!state.searchQuery) {
                resultsHTML += `<p class="text-xs text-center opacity-60 py-4">Digite termos acima para pesquisar em todo o e-book...</p>`;
            }

            resultsContent.innerHTML = resultsHTML;
        }

        function handleSearch(val) {
            state.searchQuery = val;
            renderSearchPanel();
            renderContent();
        }

        window.onload = function() {
            loadBookmarks();
            setTheme('light');
            setChapter(-1);
        };
    </script>
</body>
</html>
